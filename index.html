<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/scout-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Trolley Scout: real store specials, with the source for every price</title>
    <meta
      name="description"
      content="See what is genuinely on special at supermarkets and online stores near you. Every price links back to the retailer page it was read from, with the date it was checked. Free to use."
    />
    <meta name="author" content="Boondock Labs (Pty) Ltd" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#1c1710" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trolley Scout" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://trolleyscout.co.za/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trolley Scout" />
    <meta property="og:title" content="Trolley Scout: real store specials, with the source for every price" />
    <meta
      property="og:description"
      content="See what is genuinely on special at supermarkets and online stores near you. Every price links back to the retailer page it was read from, with the date it was checked."
    />
    <meta property="og:image" content="https://trolleyscout.co.za/assets/og-card.png" />
    <meta property="og:image:secure_url" content="https://trolleyscout.co.za/assets/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Trolley Scout grocery deals and price comparison" />
    <meta property="og:url" content="https://trolleyscout.co.za/" />
    <meta property="og:locale" content="en" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trolley Scout: real store specials, with the source for every price" />
    <meta
      name="twitter:description"
      content="See what is genuinely on special at supermarkets and online stores near you. Every price links back to the retailer page it was read from, with the date it was checked."
    />
    <meta name="twitter:image" content="https://trolleyscout.co.za/assets/og-card.png" />
    <meta name="twitter:image:alt" content="Trolley Scout grocery deals and price comparison" />

    <!-- Agent & machine-readable entry points -->
    <link rel="alternate" type="text/markdown" href="/index.md" />
    <link rel="api-catalog" href="/.well-known/api-catalog" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://trolleyscout.co.za/#organization",
            "name": "Trolley Scout",
            "url": "https://trolleyscout.co.za/",
            "logo": "https://trolleyscout.co.za/assets/scout-logo.png",
            "description": "Store specials, price comparison, nearby retailers, and property search, each price shown with the source it was read from.",
            "areaServed": [
              { "@type": "Country", "name": "Angola" },
              { "@type": "Country", "name": "Botswana" },
              { "@type": "Country", "name": "Democratic Republic of the Congo" },
              { "@type": "Country", "name": "Comoros" },
              { "@type": "Country", "name": "Lesotho" },
              { "@type": "Country", "name": "Madagascar" },
              { "@type": "Country", "name": "Mauritius" },
              { "@type": "Country", "name": "Malawi" },
              { "@type": "Country", "name": "Mozambique" },
              { "@type": "Country", "name": "Namibia" },
              { "@type": "Country", "name": "Seychelles" },
              { "@type": "Country", "name": "Eswatini" },
              { "@type": "Country", "name": "Tanzania" },
              { "@type": "Country", "name": "South Africa" },
              { "@type": "Country", "name": "Zambia" },
              { "@type": "Country", "name": "Zimbabwe" }
            ],
            "sameAs": ["https://github.com/EugeneBoondock/trolleyscout"],
            "parentOrganization": {
              "@type": "Organization",
              "name": "Boondock Labs (Pty) Ltd",
              "url": "https://boondocklabs.co.za"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://trolleyscout.co.za/#website",
            "url": "https://trolleyscout.co.za/",
            "name": "Trolley Scout",
            "inLanguage": "en",
            "publisher": { "@id": "https://trolleyscout.co.za/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://trolleyscout.co.za/deals?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "MobileApplication",
            "@id": "https://trolleyscout.co.za/#android-app",
            "name": "Trolley Scout",
            "operatingSystem": "ANDROID",
            "applicationCategory": "ShoppingApplication",
            "url": "https://trolleyscout.co.za/",
            "installUrl": "https://play.google.com/store/apps/details?id=za.co.trolleyscout.trolley_scout",
            "downloadUrl": "https://play.google.com/store/apps/details?id=za.co.trolleyscout.trolley_scout",
            "sameAs": [
              "https://play.google.com/store/apps/details?id=za.co.trolleyscout.trolley_scout",
              "https://github.com/EugeneBoondock/trolleyscout/releases/latest"
            ],
            "inLanguage": "en",
            "isAccessibleForFree": true,
            "publisher": { "@id": "https://trolleyscout.co.za/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
