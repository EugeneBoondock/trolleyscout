name = "trolley-scout"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

[ai]
binding = "AI"

# Headless Chrome for the retailers that refuse a plain fetch (PerimeterX,
# WAF 403s, client-rendered grids). Metered hard in aiBudget.ts: the Paid plan
# includes ten browser hours a month.
[browser]
binding = "BROWSER"

# Semantic search over product titles. 384 dimensions keeps the catalogue
# inside the 10M included stored dimensions.
[[vectorize]]
binding = "PRODUCT_INDEX"
index_name = "trolley-scout-products"

[[d1_databases]]
binding = "DB"
database_name = "trolley-scout"
database_id = "2c43ec07-75b4-4d1f-aacb-ea0b112f36e3"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "trolley-scout-media"
preview_bucket_name = "trolley-scout-media-preview"

[[services]]
binding = "ORGANIZATION_EMAIL"
service = "trolley-scout-organization-email"
